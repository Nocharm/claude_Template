<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF8F2; color: #1F2925; font-family: 'Gowun Dodum', system-ui, sans-serif">
  <div style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Home.dc.html" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; color: #1F2925"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <div style="flex: 1; height: 8px; border-radius: 4px; background: #ECEAE4; overflow: hidden"><div style="width: 25%; height: 8px; background: #E8743B"></div></div>
      <div style="font-size: 13px; font-weight: 700; color: #5D6762">3 / 12</div>
    </div>

    <div role="group" aria-label="문제 유형" style="display: flex; gap: 6px">
      <span style="padding: 5px 10px; border-radius: 8px; background: #1F2925; color: #FFFFFF; font-size: 12px; font-weight: 700">빈칸 채우기</span>
      <span style="padding: 5px 10px; border-radius: 8px; background: #ECEAE4; color: #3B4641; font-size: 12px; font-weight: 500">한→영 작문</span>
      <span style="padding: 5px 10px; border-radius: 8px; background: #ECEAE4; color: #3B4641; font-size: 12px; font-weight: 500">듣고 쓰기</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 16px; background: repeating-linear-gradient(#FFFFFF 0px, #FFFFFF 39px, #E3EEF2 39px, #E3EEF2 40px); border: 1px solid #E6E1D6">
      <div style="font-size: 15px; line-height: 1.6; color: #3B4641">산책을 하다가 스쿠터를 발견했을 때, <b style="color: #1F2925">그냥 지나칠 수 없었다.</b></div>
      <div style="font-family: 'Patrick Hand', 'Gamja Flower', cursive; font-size: 24px; line-height: 40px">...when we spotted some scooters, we <span style="display: inline-block; min-width: 150px; padding: 0 6px; border-bottom: 3px solid #1E7F55; background: #CDEFDC; font-weight: 700; color: #155E3F">couldn't resist</span>.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="answer" style="font-size: 13px; font-weight: 700; color: #5D6762">내 답</label>
      <input id="answer" type="text" value="couldn't resist" autocapitalize="off" autocomplete="off" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #1E7F55; background: #FFFFFF; font: inherit; font-size: 17px; color: #1F2925">
    </div>

    <div role="status" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: #F1F8F3; border: 1px solid #CDEFDC">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #155E3F"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>정답이에요</div>
      <div style="font-size: 13px; line-height: 1.6; color: #3B4641">couldn't resist — 참을 수 없었다, 유혹을 뿌리칠 수 없었다. 다음 복습은 <b>4일 뒤</b>.</div>
      <div style="display: flex; gap: 6px; padding-top: 2px">
        <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #CDEFDC; background: #FFFFFF; font: inherit; font-size: 12px; font-weight: 500; color: #155E3F; display: inline-flex; align-items: center; gap: 5px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z"></path><path d="M16.5 9a4 4 0 0 1 0 6"></path></svg>문장 듣기</button>
        <a href="Expression.dc.html" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #CDEFDC; background: #FFFFFF; font-size: 12px; font-weight: 500; color: #155E3F; display: inline-flex; align-items: center; text-decoration: none">표현 다시 보기</a>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 30px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #C9C2B3; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #3B4641">헷갈렸어요</button>
    <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #1F2925; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">다음 문제</button>
  </div>
</div>
